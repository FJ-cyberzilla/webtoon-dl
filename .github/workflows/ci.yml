name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

# Cancel outdated workflow runs for open PRs/branches automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================
  # 1. SECURITY & DEPENDENCY AUDIT
  # ==========================================
  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Govulncheck (Go Vulnerability Scanner)
        uses: golang/govulncheck-action@v1
        with:
          go-package: './...'

      - name: Run Gosec (Static Security Analysis)
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file (GitHub Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  # ==========================================
  # 2. CODE QUALITY & LINTING
  # ==========================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.0
          $(go env GOPATH)/bin/golangci-lint run --timeout 5m

  # ==========================================
  # 3. MULTI-OS TEST MATRIX & COVERAGE
  # ==========================================
  test:
    name: Test (${{ matrix.os }})
    needs: [security, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Execute unit & integration tests with race condition detection across pkg/ and cmd/
      - name: Run Tests with Race Detector
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      # Execute PDF performance benchmarks
      - name: Run PDF Benchmarks
        run: go test -v -bench=. -run=^$ ./pkg/pdf/...

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.out
          retention-days: 7

  # ==========================================
  # 4. CROSS-PLATFORM BUILD MATRIX
  # ==========================================
  build:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: bin/webtoon-dl-linux-amd64
          - goos: linux
            goarch: arm64
            output: bin/webtoon-dl-linux-arm64
          - goos: darwin
            goarch: amd64
            output: bin/webtoon-dl-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: bin/webtoon-dl-darwin-arm64
          - goos: windows
            goarch: amd64
            output: bin/webtoon-dl-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0 # Static binary compilation
        run: |
          go build -ldflags="-s -w" -v -o ${{ matrix.output }} ./cmd/webtoon-dl

      - name: Upload Compiled Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-dl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.output }}
          retention-days: 7
